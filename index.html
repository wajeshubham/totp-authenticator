<!doctype html>
<!--
  index.html: the authenticator app, a list of accounts with live codes.
  It's styled with Tailwind classes. js/app.js fills in the list every second.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authenticator</title>
  <link rel="icon" href="data:,">
  <!-- Tailwind from a CDN: no install, no build step. "integrity" makes the browser refuse the file if it ever changes. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5/dist/index.global.js" integrity="sha384-t+qLIxS5zM/KF99/doWY+dxTsavdvgayaZt8A9ntLsUjEkiXzYl5M3Ij8zVFPL9j" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-lg mx-auto p-4">
    <header class="flex items-center gap-4 mb-6">
      <h1 class="text-xl font-bold mr-auto">Authenticator</h1>
      <a href="playground.html" class="text-blue-600 hover:underline">Playground</a>
      <button id="lock-button" class="border border-gray-300 rounded px-3 py-1 bg-white hover:bg-gray-100" hidden>Lock</button>
    </header>

    <!-- The lock screen. The same form creates the vault (first visit) or unlocks it. -->
    <form id="lock-form" class="bg-white border border-gray-200 rounded-lg p-4 space-y-3">
      <h2 id="lock-title" class="font-semibold">Unlock</h2>
      <p class="text-sm text-gray-600">Your accounts are encrypted with this password. If you forget it, they can't be recovered.</p>
      <input id="password-input" type="password" required autofocus autocomplete="current-password" placeholder="Master password" class="w-full border border-gray-300 rounded px-3 py-2">
      <input id="repeat-input" type="password" autocomplete="new-password" placeholder="Repeat the password" class="w-full border border-gray-300 rounded px-3 py-2">
      <button class="bg-blue-600 text-white rounded px-4 py-2 font-medium hover:bg-blue-700">Continue</button>
      <p id="lock-error" class="text-sm text-red-600 empty:hidden"></p>
    </form>

    <main id="app" hidden>
      <!-- One countdown for every account, because all the codes change at the same moment. -->
      <div class="flex items-center gap-3 mb-4">
        <div class="flex-1 h-2 bg-gray-200 rounded overflow-hidden">
          <div id="timer-bar" class="h-full bg-blue-600 transition-all duration-1000 ease-linear"></div>
        </div>
        <span id="timer-text" class="w-10 text-right text-sm text-gray-500">30 s</span>
      </div>

      <ul id="account-list" class="bg-white border border-gray-200 rounded-lg divide-y divide-gray-200 empty:hidden"></ul>
      <p id="empty-message" class="text-gray-500" hidden>No accounts yet. Add one below.</p>

      <form id="add-form" class="mt-6 bg-white border border-gray-200 rounded-lg p-4 space-y-3">
        <h2 class="font-semibold">Add account</h2>
        <label class="block text-sm">Name
          <input id="name-input" required autocomplete="off" placeholder="GitHub" class="mt-1 w-full border border-gray-300 rounded px-3 py-2">
        </label>
        <label class="block text-sm">Secret key
          <input id="key-input" required autocomplete="off" spellcheck="false" placeholder="JBSW Y3DP EHPK 3PXP" class="mt-1 w-full border border-gray-300 rounded px-3 py-2 font-mono">
        </label>
        <button class="bg-blue-600 text-white rounded px-4 py-2 font-medium hover:bg-blue-700">Add account</button>
        <p id="add-error" class="text-sm text-red-600 empty:hidden"></p>
      </form>
    </main>
  </div>

  <!-- One row of the list. app.js makes a copy of it for every account. -->
  <template id="account-template">
    <li class="flex items-center gap-2 p-3">
      <div class="flex-1 min-w-0">
        <div class="account-name text-sm text-gray-500 truncate"></div>
        <div class="code font-mono text-3xl font-semibold tracking-wider">--- ---</div>
      </div>
      <button class="copy-button border border-gray-300 rounded px-3 py-1 hover:bg-gray-100">Copy</button>
      <button class="delete-button border border-gray-300 rounded px-3 py-1 text-red-600 hover:bg-red-50">Delete</button>
    </li>
  </template>
</body>
</html>
